<div>
    <div>
        <h1>{{vm.recipe.name}}</h1>
        Tags: {{vm.tags}}
    </div>
    <div>
        <img ng-show="vm.loading" src="images/loading.gif" alt="chargement..." class="loading" />
        <ng-pdf ng-hide="vm.loading" template-url="shared/pdf/pdf_viewer.html" scale="page-fit"></ng-pdf>
    </div>
    <div>
        <ul class="no-bullet-list">
            <li>
                <app-comment comment-updated="vm.commentUpdated(comment)" recipe-id="vm.recipeId"></app-comment>
            </li>
            <li ng-repeat="comment in vm.comments">
                <app-comment comment-updated="vm.commentUpdated(comment)" comment="comment" recipe-id="vm.recipeId"></app-comment>
            </li>
        </ul>
    </div>
</div>
