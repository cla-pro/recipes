<div>
    <!-- Search box -->
    <div>
        <input style="width: 99%" type="text" ng-model="vm.query" autofocus
               ng-keyup="$event.keyCode == 13 && vm.newSearch()" placeholder="Filtre" />
        <br /><br />
        <app-help help-text="vm.helpText"></app-help>
        <br />
        <button ng-click="vm.newSearch()">Rechercher</button>
    </div>
    <br />
    <!-- Results -->
    <app-result-list ng-hide="vm.reload" results="vm.recipes" message="vm.message" query="vm.encodedQuery"></app-result-list>
    <img ng-show="vm.loading" src="images/loading.gif" alt="chargement..." class="loading" />
    <div ng-show="vm.hasMoreRecipes && !vm.loading" ng-click="vm.search()" class="more">Plus de recettes</div>
</div>
