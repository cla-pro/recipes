<section class="panel">
  <h2>Edit recipe</h2>

  <form [formGroup]="form" (ngSubmit)="save()" class="form-grid">
    <label>
      Name
      <input type="text" formControlName="name">
    </label>

    <label>
      Tags (comma separated)
      <input type="text" formControlName="tags">
    </label>

    <label>
      Replace file (optional)
      <input type="file" (change)="onFileSelected($event)">
    </label>

    <div class="buttons">
      <button type="button" (click)="back()">Cancel</button>
      <button type="submit" [disabled]="loading">{{ loading ? 'Saving...' : 'Save changes' }}</button>
      <button type="button" class="danger" (click)="deleteRecipe()" [disabled]="deleting">
        {{ deleting ? 'Deleting...' : 'Delete recipe' }}
      </button>
    </div>
  </form>

  <p *ngIf="message.length > 0" [class.error]="isError">{{ message }}</p>
</section>
